<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>INS. Producer Contest</title>
<style>
  :root { --navy:#0f2044; --pink:#e8447f; --muted:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f6f7fb; color:var(--navy);
         font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; padding:24px; }
  .card { background:#fff; border-radius:16px; padding:48px 40px; max-width:520px; width:100%;
          box-shadow:0 8px 28px rgba(15,32,68,.10); text-align:center; }
  .mark { font-size:30px; font-weight:800; letter-spacing:-.5px; }
  .mark span { color:var(--pink); }
  .rule { height:3px; width:52px; background:var(--pink); border-radius:2px; margin:22px auto 26px; }
  h1 { font-size:20px; font-weight:700; margin:0 0 14px; }
  p { font-size:15px; line-height:1.65; color:var(--muted); margin:0 0 12px; }
  .foot { margin-top:28px; font-size:13px; color:#9aa1ad; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">INS<span>.</span></div>
    <div class="rule"></div>
    <h1>The producer contest has ended.</h1>
    <p>The daily scoreboard is no longer being updated. Final standings are kept internally.</p>
    <p>Questions, talk to Michael.</p>
    <div class="foot">Closed August 2026</div>
  </div>
</body>
</html>
